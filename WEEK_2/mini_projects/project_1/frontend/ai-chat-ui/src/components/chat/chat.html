<div class="chat-container" #chatContainer>

    <header class="header"><b><i><u>Chat with Alataf!</u></i></b></header>
    @for(message of messages; track $index){
    <div class="message" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'">

        @if(message.role === 'assistant') { <markdown [data]="message.content"></markdown> }
        @else { {{message.content}} }
    </div>
    }
</div>

<div class="input-container">
    <input [(ngModel)]="userInput" placeholder="Ask something about me..." (keyup.enter)="sendMessage()" />

    <button (click)="sendMessage()"> Send </button>
</div>
