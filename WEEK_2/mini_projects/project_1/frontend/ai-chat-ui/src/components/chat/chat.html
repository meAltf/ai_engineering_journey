<div class="chat-shell">
  <!-- Top header inside the component -->
  <div class="chat-header">AI Candidate Assistant</div>

  <div class="chat-window">
    <header class="header">
      <div class="title">
        <strong>AI Advisor</strong>
        <p>Ask anything about my work, skills, and projects.</p>
      </div>
      <span class="status" *ngIf="loading">Typing...</span>
    </header>

    <!-- Messages area (scrollable) -->
    <div class="messages" #chatContainer>
      <div *ngFor="let message of messages; let i = index" class="message" [ngClass]="{user: message.role === 'user', assistant: message.role === 'assistant'}">
        <markdown [data]="message.content"></markdown>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <input [(ngModel)]="userInput" placeholder="Ask something about my work..." (keyup.enter)="sendMessage()" />
      <button class="send-btn" [disabled]="loading" (click)="sendMessage()">Send</button>
    </div>
  </div>
</div>
