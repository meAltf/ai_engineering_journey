<div class="page-header">
  <h1>DSA Lecture Search</h1>
  <p>From a dsa RAG system, Search and watch DSA lectures with instant explanations and timestamps.</p>
</div>

<div class="layout">

  <div class="chat-container">

    <!-- messages -->
    <div class="messages">

      <div *ngFor="let msg of messages" class="message" [class.user]="msg.role === 'user'"
        [class.ai]="msg.role === 'assistant'">

        <div class="text">
          <div class="text" [innerHTML]="msg.content"></div>
        </div>

        <!-- SOURCES -->
        <div class="sources" *ngIf="msg.sources">

          <div *ngFor="let s of msg.sources">
            <span class="link" (click)="playVideo(s)">
              ▶ {{ s.video_id }} ({{ s.start_time }})
            </span>
            <!-- <a [href]="s.url" target="_blank"> ▶ {{ s.video_id }} ({{ s.start_time }}) </a> -->
          </div>
        </div>
      </div>
    </div>

    <!-- input -->
    <div class="input-box">

      <input [(ngModel)]="userInput" placeholder="Ask something..." (keyup.enter)="sendMessage()" />

      <button (click)="sendMessage()">Send</button>

    </div>
  </div>

  <!-- RIGHT: VIDEO -->
  <div class="video-section">

    <iframe *ngIf="videoUrl" [src]="videoUrl" frameborder="0" >
    </iframe>

  </div>
</div>
